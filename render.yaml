services:
  # 1. Наш бэкенд NestJS
  - type: web
    name: prod-api
    env: docker
    plan: free
    envVars:
      # Общие настройки
      - key: NODE_ENV
        value: production

      # Динамические переменные для Postgres
      - key: DB_USER
        fromDatabase:
          name: prod-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: prod-postgres
          property: password
      - key: DB_NAME
        fromDatabase:
          name: prod-postgres
          property: database
      - key: DB_PORT
        fromDatabase:
          name: prod-postgres
          property: port
      - key: DATABASE_URL
        fromDatabase:
          name: prod-postgres
          property: connectionString

      # Динамические переменные для Redis (тип изменен на redis для совместимости с fromService)
      - key: REDIS_HOST
        fromService:
          type: redis
          name: prod-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: prod-redis
          property: port

      # Логгер
      - key: LOGGER_HTTP_AUTO_LOGGING
        value: "false"

      # Секреты (Значения введете вручную в панели Render)
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: QUEUE_DASHBOARD_USERNAME
        sync: false
      - key: QUEUE_DASHBOARD_PASSWORD
        sync: false

  # 2. Настройка Redis (Key Value)
  - type: keyvalue
    name: prod-redis
    plan: free
    ipAllowList: [] 

# 3. База данных Postgres
databases:
  - name: prod-postgres
    plan: free
    databaseName: host
    user: db_user
