services:
  postgres:
    image: postgres:16-alpine
    container_name: prod-postgres
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - prod_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prod-redis
    restart: always
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: rodionpozniak/nest_host_api:latest
    container_name: prod-api
    restart: always
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    env_file:
      - .env.production 
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  prod_postgres_data:
  prod_redis_data:
